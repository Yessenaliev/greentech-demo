<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="description" content="Демо-версия приложения GreenTech для гидрофермы. Данные условные.">
<style>:root{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<meta charset="utf-8">
<meta name="claude:viewport-fit-sides" content="cover">
<title>GreenTech демо фермы</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: one-screen app. The 3D farm fills the left; a task panel docks right and drops below on phones. */
:root{
  --bg:#0B1210; --surface:#121C18; --surface-2:#19261F; --line:#25382E;
  --fg:#E8F0EA; --muted:#9DB1A5; --grow:#5FD38D; --warn:#FFB14A; --on-accent:#06140C;
  --scrim:rgba(11,18,16,.88);
  --font-ui:'Manrope',system-ui,'Segoe UI',sans-serif;
  --font-num:'IBM Plex Mono',ui-monospace,Consolas,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font-ui);font-size:14px;line-height:1.45;overflow:hidden}
*{box-sizing:border-box}
[hidden]{display:none!important}
h1,h2,p{margin:0}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--grow);outline-offset:2px}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums}

.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 440px;grid-template-rows:auto minmax(0,1fr)}
.bar{grid-column:1/-1;display:flex;flex-wrap:nowrap;align-items:center;gap:6px 18px;padding-block:10px;min-height:46px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line)}
.brand{font-size:20px;font-weight:800;letter-spacing:-.02em}
.crumb{flex:1 1 0;min-width:0;color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.demo{border:1px solid var(--warn);color:var(--warn);font-weight:700;font-size:12px;border-radius:6px;padding:3px 8px;white-space:nowrap;flex:none}
.clock{flex:none}
.clock{display:flex;align-items:center;gap:8px}
.live{width:9px;height:9px;border-radius:50%;background:var(--grow);animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(95,211,141,.6)}70%{box-shadow:0 0 0 9px rgba(95,211,141,0)}100%{box-shadow:0 0 0 0 rgba(95,211,141,0)}}
@keyframes alert{0%{box-shadow:0 0 0 0 rgba(255,177,74,.75)}70%{box-shadow:0 0 0 9px rgba(255,177,74,0)}100%{box-shadow:0 0 0 0 rgba(255,177,74,0)}}

.stage{position:relative;min-width:0;min-height:0;overflow:hidden;background:var(--bg)}
#gl{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
#gl.drag{cursor:grabbing}
/* заставка на время загрузки сцены: видна сразу, уходит после первого кадра */
.splash{position:absolute;inset:0;z-index:5;background:var(--bg);display:flex;align-items:flex-end;overflow:hidden;transition:opacity .6s ease}
.splash.gone{opacity:0;pointer-events:none}
.splash img{position:absolute;inset:0;width:100%;height:100%;max-width:none;object-fit:cover}
.splash-b{position:relative;width:100%;display:flex;flex-direction:column;gap:8px;background:var(--bg);padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:16px}
.splash-t{font-weight:800;font-size:16px}
.splash-p{height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.splash-p i{display:block;width:40%;height:100%;border-radius:2px;background:var(--grow);animation:gtload 1.2s ease-in-out infinite}
@keyframes gtload{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}
.splash.static .splash-p{display:none}
@media (prefers-reduced-motion:reduce){.splash-p i{animation:none;width:100%}}
.nogl{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;color:var(--muted)}
#tags{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.tag{position:absolute;left:0;top:0;display:flex;align-items:center;gap:9px;white-space:nowrap;background:var(--scrim);border:1px solid var(--line);will-change:transform}
.tag .dot{width:10px;height:10px;border-radius:50%;background:var(--grow);flex:none}
.tag.go{pointer-events:auto;cursor:pointer;min-height:44px;padding:4px 16px 4px 12px;border-radius:999px;border-color:var(--grow);text-align:left}
.tag.go:hover{background:var(--surface-2)}
.tag.go .dot{animation:pulse 2s infinite}
.tag.go.hot{border-color:var(--warn)}
.tag.go.hot .dot{background:var(--warn);animation:alert 1.5s infinite}
.tag .t{display:flex;flex-direction:column;line-height:1.25}
.tag .t b{font-weight:800}
.tag .t span{font-size:12px;color:var(--muted)}
.tag.go.hot .t span{color:var(--warn)}
.tag.chip{padding:5px 11px 5px 9px;border-radius:9px}
.tag.chip .t b{font-family:var(--font-num);font-weight:600;font-size:13px}
.tag.chip .t span{font-size:11px;font-weight:600}
.tag.chip.hot{border-color:var(--warn)}
.tag.chip.hot .dot{background:var(--warn);animation:alert 1.5s infinite}
.tag.chip.hot .t b{color:var(--warn)}
.hud{position:absolute;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.hud.top{left:max(12px,env(safe-area-inset-left,0px));top:12px}
.hud.bottom{left:max(12px,env(safe-area-inset-left,0px));right:12px;bottom:12px}
.hbtn{min-height:44px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--scrim);font-weight:700;cursor:pointer;display:flex;align-items:center;gap:8px}
.hbtn[aria-pressed="true"]{border-color:var(--grow);color:var(--grow)}
.hbtn.back{border-color:var(--grow)}
.hint{color:var(--muted);font-size:12px;background:var(--scrim);border-radius:8px;padding:4px 10px}
.hbtn.tour{border-color:var(--grow);background:var(--grow);color:var(--on-accent)}
.hbtn.tour[aria-pressed="true"]{background:var(--scrim);color:var(--grow)}
.vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 56%,rgba(0,0,0,.4) 100%);transition:box-shadow .5s ease}
.app.touring .vig{box-shadow:inset 0 44px 0 #000,inset 0 -44px 0 #000}
.app.touring #tags,.app.touring .hint,.app.touring #tSensors{display:none}
.cap{position:absolute;left:50%;bottom:74px;transform:translateX(-50%);width:max-content;max-width:min(88%,760px);text-align:center;font-size:19px;font-weight:800;line-height:1.25;background:var(--scrim);border-radius:12px;padding:10px 18px;text-wrap:balance}

.panel{min-width:0;min-height:0;overflow-y:auto;background:var(--surface);border-left:1px solid var(--line);
  padding-block:18px;padding-left:18px;padding-right:max(18px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
.kicker{color:var(--grow);font-weight:800;font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.panel h1{font-size:24px;font-weight:800;line-height:1.2;letter-spacing:-.01em;text-wrap:balance}
.panel h2{font-size:15px;font-weight:800}
.lead{color:var(--muted)}
.sec{display:flex;flex-direction:column;gap:10px}
.where{gap:4px}
.ways{display:flex;flex-wrap:wrap;gap:6px}
.way{min-height:44px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface-2);font-weight:700;cursor:pointer;display:flex;align-items:center;gap:8px}
.way:hover{border-color:var(--grow)}
.way .n{background:var(--warn);color:#2B1600;border-radius:10px;padding:0 7px;font-size:12px;font-family:var(--font-num);font-weight:600}
.task{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:7px}
.task.urgent{border-color:var(--warn)}
.task.done{opacity:.5}
.task .top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:6px}
.lvl{font-weight:800;font-size:12px;border-radius:6px;padding:2px 8px}
.lvl.urgent{background:var(--warn);color:#2B1600}
.lvl.warn{background:#3A2A10;color:var(--warn)}
.lvl.plan{background:#16301F;color:var(--grow)}
.who{color:var(--muted);font-size:12px;font-weight:600}
.what{color:var(--muted);font-size:13px}
.what b{color:var(--fg)}
.act{font-weight:800;font-size:15px;line-height:1.3}
details{background:var(--surface-2);border-radius:8px;padding:8px 10px}
summary{cursor:pointer;font-weight:700;font-size:13px;min-height:24px}
.why{display:grid;grid-template-columns:104px minmax(0,1fr);gap:5px 10px;font-size:12px;margin-top:8px}
.why dt{color:var(--muted)}
.why dd{margin:0}
.btns{display:flex;flex-wrap:wrap;gap:6px}
.btn{min-height:44px;padding:0 16px;border-radius:9px;border:1px solid var(--grow);background:transparent;color:var(--grow);font-weight:800;cursor:pointer}
.btn.solid{background:var(--grow);color:var(--on-accent)}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.fact{background:var(--surface-2);border-radius:10px;padding:9px 11px;min-width:0}
.fact .k{color:var(--muted);font-size:12px;font-weight:600}
.fact .v{font-family:var(--font-num);font-size:18px;font-weight:600;overflow-wrap:anywhere}
.fact .v small{font-size:11px;color:var(--muted);font-weight:500}
.fact .n{font-family:var(--font-num);font-size:11px;color:var(--muted)}
.fact.bad .v{color:var(--warn)}
.note{font-size:12px;color:var(--muted)}
.crops{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.crop{min-height:44px;padding:6px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);font-weight:700;cursor:pointer;text-align:left;display:flex;align-items:center;gap:8px}
.crop i{width:12px;height:12px;border-radius:50%;flex:none;border:1px solid rgba(255,255,255,.35)}
.crop[aria-pressed="true"]{border-color:var(--grow);color:var(--grow)}
.card{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px}
.card h2{font-size:18px}
.src{align-self:flex-start;font-size:11px;font-weight:700;border-radius:6px;padding:2px 8px;border:1px solid var(--line);color:var(--muted)}
.src.check{border-color:var(--warn);color:var(--warn)}
.sl{display:grid;grid-template-columns:minmax(0,1fr) 78px;gap:2px 10px;align-items:center}
.sl label{font-weight:700;font-size:13px}
.sl output{font-family:var(--font-num);text-align:right;font-weight:600}
.sl input{grid-column:1/-1;width:100%;accent-color:var(--grow);min-height:28px}
.sl .rng{grid-column:1/-1;font-family:var(--font-num);font-size:11px;color:var(--muted)}
.calc{display:flex;flex-direction:column;gap:6px}
.res{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;background:var(--surface-2);border-radius:10px;padding:9px 11px}
.res .k{font-weight:700}
.res .v{font-family:var(--font-num);font-weight:600;font-size:16px;text-align:right}
.res .f{grid-column:1/-1;font-family:var(--font-num);font-size:11px;color:var(--muted)}
.res .s{grid-column:1/-1;font-size:12px;font-weight:700;color:var(--grow)}
.res.bad .v,.res.bad .s{color:var(--warn)}

/* вкладки функций: видна только секция выбранной вкладки */
.panel #pTasks,.panel #pFacts,.panel #pCrops,.panel #pExtra{display:none}
.panel[data-tab="tasks"] #pTasks,.panel[data-tab="facts"] #pFacts,.panel[data-tab="crops"] #pCrops,.panel[data-tab="extra"] #pExtra{display:flex}
.tabs{display:flex;flex-wrap:wrap;gap:4px;border-bottom:1px solid var(--line);padding-bottom:10px}
.tab{min-height:44px;padding:0 13px;border-radius:9px;border:1px solid transparent;background:transparent;color:var(--muted);font-weight:700;cursor:pointer;display:flex;align-items:center;gap:7px}
.tab:hover{color:var(--fg)}
.tab[aria-selected="true"]{background:var(--surface-2);border-color:var(--grow);color:var(--fg)}
.tab .n{background:var(--warn);color:#2B1600;border-radius:10px;padding:0 7px;font-size:12px;font-family:var(--font-num);font-weight:600}
.bdg{display:inline-block;font-size:11px;font-weight:700;border-radius:6px;padding:1px 7px;border:1px solid var(--line);color:var(--muted);vertical-align:middle;white-space:nowrap}
.bdg.w{border-color:var(--warn);color:var(--warn)}
.kv{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:7px 12px;margin:0;font-size:13px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;display:flex;flex-direction:column}
.kv dd b{font-weight:600;font-size:14px}
.kv dd span{font-size:11px;color:var(--muted);font-family:var(--font-num)}
.kv dd.bad b{color:var(--warn)}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--grow)}
.bar.w i{background:var(--warn)}
.box{background:var(--surface-2);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.box .t{font-weight:800}
.box .s{font-size:12px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.frm{font-family:var(--font-num);font-size:12px;color:var(--muted);background:var(--surface-2);border-radius:8px;padding:8px 10px;line-height:1.6;overflow-wrap:anywhere}
.line{display:flex;align-items:center;gap:10px;min-height:44px;border-bottom:1px solid var(--line)}
.line:last-child{border-bottom:0}
.line .g{flex:1;min-width:0}
.line .g b{display:block;font-weight:700}
.line .g span{font-size:12px;color:var(--muted)}
.line .r{font-family:var(--font-num);font-size:12px;color:var(--muted);text-align:right;white-space:nowrap}
.dotS{width:9px;height:9px;border-radius:50%;background:var(--grow);flex:none}
.dotS.w{background:var(--warn)}
.chk{width:44px;height:44px;flex:none;border-radius:9px;border:1px solid var(--line);background:var(--surface-2);cursor:pointer;display:flex;align-items:center;justify-content:center}
.chk[aria-pressed="true"]{background:var(--grow);border-color:var(--grow);color:var(--on-accent)}
.chk svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.chk[aria-pressed="true"] svg{opacity:1}
.mini{min-height:44px;padding:0 12px;border-radius:9px;border:1px solid var(--line);background:transparent;color:var(--grow);font-weight:700;cursor:pointer;white-space:nowrap}
.fld{display:grid;grid-template-columns:minmax(0,1fr) 132px;gap:4px 10px;align-items:center}
.fld label{font-weight:700;font-size:13px}
.fld input{min-height:44px;width:100%;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font-family:var(--font-num);font-size:14px;padding:0 10px;text-align:right}
.seg{display:flex;gap:4px}
.seg button{flex:1;min-height:44px;border-radius:9px;border:1px solid var(--line);background:var(--surface-2);font-weight:700;cursor:pointer}
.seg button[aria-pressed="true"]{border-color:var(--grow);color:var(--grow)}
.big{font-family:var(--font-num);font-size:22px;font-weight:600}
.big.pos{color:var(--grow)}
.big.neg{color:var(--warn)}
.scn{width:100%;border-collapse:collapse;font-size:12px}
.scn th,.scn td{padding:6px 4px;text-align:right;border-bottom:1px solid var(--line);font-family:var(--font-num);font-weight:500}
.scn th:first-child,.scn td:first-child{text-align:left;font-family:var(--font-ui);color:var(--muted)}
.scn thead th{font-family:var(--font-ui);font-weight:800;color:var(--fg)}
.scroll{overflow-x:auto}
.steps{display:flex;flex-direction:column;gap:8px;counter-reset:st}
.photo{width:100%;height:auto;display:block;border-radius:10px;background:var(--bg)}

@media (max-width:860px){
  body{overflow:hidden}
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(240px,44%) minmax(0,1fr)}
  .panel{border-left:0;border-top:1px solid var(--line);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .hint{display:none}
  .bar{gap:6px 10px}
  .brand{font-size:18px}
  .demo{font-size:11px;padding:2px 6px}
  .clock .num{display:none}
  .tag.go{min-height:34px;padding:2px 11px 2px 8px;font-size:12px;gap:7px}
  .tag.go .t span{display:none}
  .tag.chip{display:none}
  .hbtn{min-height:40px;padding:0 11px;font-size:13px}
  .cap{font-size:15px;bottom:62px}
}
@media (prefers-reduced-motion:reduce){.live,.tag .dot{animation:none!important}}
</style>

<div class="app">
  <header class="bar">
    <div class="brand">GreenTech</div>
    <div class="crumb num" id="crumb">Ферма</div>
    <span class="demo">Демо-версия. Данные условные</span>
    <span class="clock"><span class="live"></span><span class="num" id="clock">14:32:00</span></span>
  </header>

});

  var id = e.target.id, em = { eTar: 'tar', ePrice: 'price', eFot: 'fot', eCons: 'cons', eOther: 'other', eCapex: 'capex' };
  if (em[id]) { E[em[id]] = Math.max(0, parseFloat(e.target.value) || 0); econOut(); return; }
  if (id === 'dP' || id === 'dH') { M[id === 'dP' ? 'ppfd' : 'h'] = parseFloat(e.target.value); dliOut(); return; }
  var c = S.crop && cropById(S.crop); if (!c) return;
  var map = { sT: 't', sRH: 'rh', sP: 'ppfd', sH: 'h' }, k = map[e.target.id];
  if (k) { c.cur[k] = parseFloat(e.target.value); updateCalc(); }
});
$('#back').addEventListener('click', function () { go(S.crop ? 'showcase' : S.loc === 'shelf' ? 'hall' : 'overview'); });
$('#tSensors').addEventListener('click', function () { S.sensors = !S.sensors; this.setAttribute('aria-pressed', S.sensors); buildTags(); });
$('#tNight').addEventListener('click', function () {
  S.night = !S.night; this.setAttribute('aria-pressed', S.night);
  if (!renderer) return;
  renderer.toneMappingExposure = S.night ? 0.34 : 1.1;
  lights.dir.intensity = S.night ? 0.05 : 0.55;
  stripMat.color.setHex(S.night ? 0x2C2A3A : 0xFFF1DE); haloMat.opacity = S.night ? 0.03 : 0.34;
});
$('#tTour').addEventListener('click', function () { if (tour) stopTour(false); else startTour(); });

var drag = null;
canvas.addEventListener('pointerdown', function (e) { drag = { x: e.clientX, y: e.clientY }; canvas.classList.add('drag'); try { canvas.setPointerCapture(e.pointerId); } catch (err) {} });
canvas.addEventListener('pointermove', function (e) {
  if (!drag || tween || tour) return;
  yaw += (e.clientX - drag.x) * 0.005; pitch += (e.clientY - drag.y) * 0.003;
  pitch = Math.max(-0.45, Math.min(0.45, pitch)); drag.x = e.clientX; drag.y = e.clientY;
});
var endDrag = function () { drag = null; canvas.classList.remove('drag'); };
canvas.addEventListener('pointerup', endDrag); canvas.addEventListener('pointercancel', endDrag);

/* ---------- цикл ---------- */
function resize() {
  var r = stage.getBoundingClientRect(); W = Math.max(1, r.width); H = Math.max(1, r.height);
  if (!renderer) return;
  renderer.setSize(W, H, false); camera.aspect = W / H; camera.fov = W / H < 1 ? 62 : 46; camera.updateProjectionMatrix();
  if (S.loc === 'overview' && !tween && !tour) base.p.fromArray(overviewCam());
}
var firstFrame = false;
function frame(now) {
  requestAnimationFrame(frame);
  if (!renderer || document.hidden) return;
  if (tour) {
    var total = TOUR.length * SEG_MS, u = ((now - tour.t0) % total) / total, seg = Math.floor(u * TOUR.length + 0.35) % TOUR.length;
    tourP.getPoint(u, camera.position); tourT.getPoint(u, tourLook); camera.lookAt(tourLook);
    if (seg !== tour.seg) { tour.seg = seg; $('#cap').textContent = TOUR[seg].c; }
  } else {
    if (tween) {
      var k = Math.min(1, (now - tween.t0) / tween.dur), e = k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
      base.p.lerpVectors(tween.fp, tween.tp, e); base.p.y += Math.sin(Math.PI * e) * tween.lift;
      base.t.lerpVectors(tween.ft, tween.tt, e);
      if (k >= 1) tween = null;
    }
    var v = actualView();
    if (!reduceMotion && !tween) { v.p.x += Math.sin(now / 2600) * 0.03; v.p.y += Math.sin(now / 1900) * 0.015; }
    camera.position.copy(v.p); camera.lookAt(v.t);
  }
  var cp = camera.position, inside = cp.y < 4.42 && cp.x > -0.1 && cp.x < 29.1 && cp.z > -0.1 && cp.z < 20.1;
  if (frontWalls[0].visible !== inside) frontWalls.forEach(function (w) { w.visible = inside; });
  hotFrame.visible = !S.done.ph; hotFrame.material.opacity = 0.55 + 0.45 * Math.sin(now / 300);
  renderer.render(scene, camera);
  if (!firstFrame) { firstFrame = true; var sp = $('#splash'); if (sp) { sp.classList.add('gone'); setTimeout(function () { sp.hidden = true; }, 700); } }
  placeTags(W, H);
}

var ok = false;
try { ok = initGL(); } catch (err) { ok = false; renderer = null; }
if (!ok) { renderer = null; canvas.hidden = true; var sp0 = $('#splash'); if (sp0) { sp0.classList.add('static'); sp0.querySelector('.splash-t').textContent = 'Трёхмерный вид не запустился в этом браузере. Разделы и задачи доступны ниже.'; } $('#tSensors').hidden = true; $('#tNight').hidden = true; }
renderAll(); resize();
if (window.ResizeObserver) new ResizeObserver(resize).observe(stage); else window.addEventListener('resize', resize);
requestAnimationFrame(frame);
setInterval(function () {
  S.tick++;
  var total = 14 * 3600 + 32 * 60 + S.tick * 2, p = function (n) { return String(n).padStart(2, '0'); };
  $('#clock').textContent = p(Math.floor(total / 3600) % 24) + ':' + p(Math.floor(total / 60) % 60) + ':' + p(total % 60);
  var a = document.activeElement;
  if (!(a && a.closest && a.closest('#pFacts'))) renderFacts();
  refreshChips();
}, 2000);
})();
</script>
